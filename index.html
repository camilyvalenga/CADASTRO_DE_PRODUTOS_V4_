<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque - POO</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>𝙲𝚊𝚍𝚊𝚜𝚝𝚛𝚘 𝚍𝚎 𝙿𝚛𝚘𝚍𝚞𝚝𝚘𝚜</h1>

        <!-- Formulário de Entrada -->
        <form id="produto-form">
            <div class="form-group">
                <label for="nome">Nome do Produto:</label>
                <input type="text" id="nome" placeholder="Ex. Notebook">
            </div>

            <div class="form-group">
                <label for="preco">Preço (R$):</label>
                <input type="number" id="preco" step="0.01" placeholder="Ex. 3500.00">
            </div>

            <div class="form-group">
                <label for="quantidade">Quantidade:</label>
                <input type="number" id="quantidade" placeholder="Ex. 5">
            </div>

            <button type="submit" class="btn-primary">Adicionar Produto</button>
        </form>

        <!-- Cabeçalho de ações e resumo -->
        <div class="resumo-container">
            <h3 id="total-estoque">Total em Estoque: R$ 0,00</h3>

            <button id="limpar-tabela" class="btn-danger">
                Limpar Tudo
            </button>
        </div>

        <!-- Tabela de Exibição -->
        <table id="tabela-produtos">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Preço - Un.</th>
                    <th>Qtd.</th>
                    <th>Subtotal</th>
                    <th>Ações</th>
                </tr>
            </thead>

            <tbody>

            </tbody>
        </table>
    </div>

    <img src="pinguimdigitando.jpg" alt="" class="img3">
    <h1 class="balao">cadastrando produtos...</h1>

    <script src="script.js"></script>
</body>

</html>
